apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: board-uploads-pvc
  namespace: board-app
spec:
  accessModes:
    - ReadWriteMany  # 여러 Pod가 동시에 읽고 쓸 수 있도록
  resources:
    requests:
      storage: 10Gi  # 필요한 용량으로 조정 (10GB)
  storageClassName: nfs-client  # 클러스터의 StorageClass 이름으로 변경 필요
